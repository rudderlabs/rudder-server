version: "2"
linters:
  enable:
    - bodyclose
    - decorder
    - depguard
    - forbidigo
    - gosec
    - makezero
    - misspell
    - nilerr
    - nilnil
    - rowserrcheck
    - unconvert
    - unparam
    - wastedassign
  settings:
    depguard:
      rules:
        main:
          files:
            - $all
            - '!**/uuid_test.go'
          deny:
            - pkg: github.com/gofrs/uuid
              desc: use github.com/google/uuid instead
            - pkg: golang.org/x/exp/slices
              desc: use "slices" instead
            - pkg: github.com/json-iterator/go
              desc: use "jsonrs" instead
            - pkg: github.com/rudderlabs/sonnet
              desc: use "jsonrs" instead
            - pkg: github.com/aws/aws-sdk-go$
              desc: use "aws-sdk-go-v2" instead
            - pkg: github.com/aws/aws-sdk-go/
              desc: use "aws-sdk-go-v2" instead
        ginkgo:
          files:
            - $all
            # files still using ginkgo; drop entries as they are migrated
            - '!${base-path}/enterprise/reporting/error_reporting_core_test.go'
            - '!${base-path}/enterprise/reporting/reporting_suite_test.go'
            - '!${base-path}/enterprise/reporting/reporting_test.go'
            - '!${base-path}/enterprise/suppress-user/suppress_user_suite_test.go'
            - '!${base-path}/enterprise/suppress-user/suppress_user_test.go'
            - '!${base-path}/gateway/gateway_suite_test.go'
            - '!${base-path}/gateway/gateway_test.go'
            - '!${base-path}/processor/manager_test.go'
            - '!${base-path}/processor/processor_suite_test.go'
            - '!${base-path}/processor/processor_test.go'
            - '!${base-path}/router/batchrouter/asyncdestinationmanager/bing-ads/audience/bingads_suite_test.go'
            - '!${base-path}/router/batchrouter/asyncdestinationmanager/bing-ads/audience/bingads_test.go'
            - '!${base-path}/router/batchrouter/asyncdestinationmanager/bing-ads/common/common_suite_test.go'
            - '!${base-path}/router/batchrouter/asyncdestinationmanager/bing-ads/common/token_test.go'
            - '!${base-path}/router/batchrouter/asyncdestinationmanager/bing-ads/offline-conversions/bingads_suite_test.go'
            - '!${base-path}/router/batchrouter/asyncdestinationmanager/bing-ads/offline-conversions/bingads_test.go'
            - '!${base-path}/router/batchrouter/asyncdestinationmanager/eloqua/eloqua_suite_test.go'
            - '!${base-path}/router/batchrouter/asyncdestinationmanager/eloqua/eloqua_test.go'
            - '!${base-path}/router/batchrouter/asyncdestinationmanager/lytics_bulk_upload/lytics_suite_test.go'
            - '!${base-path}/router/batchrouter/asyncdestinationmanager/lytics_bulk_upload/lytics_test.go'
            - '!${base-path}/router/batchrouter/asyncdestinationmanager/yandexmetrica/yandexmetrica_suite_test.go'
            - '!${base-path}/router/batchrouter/asyncdestinationmanager/yandexmetrica/yandexmetrica_test.go'
            - '!${base-path}/router/batchrouter/batchrouter_suite_test.go'
            - '!${base-path}/router/batchrouter/batchrouter_test.go'
            - '!${base-path}/router/manager/manager_test.go'
            - '!${base-path}/router/masking_test.go'
            - '!${base-path}/router/router_suite_test.go'
            - '!${base-path}/router/router_test.go'
            - '!${base-path}/router/worker_test.go'
            - '!${base-path}/services/debugger/cache/internal/badger/badger_suite_test.go'
            - '!${base-path}/services/debugger/cache/internal/badger/badger_test.go'
            - '!${base-path}/services/debugger/cache/internal/memory/memory_suite_test.go'
            - '!${base-path}/services/debugger/cache/internal/memory/memory_test.go'
            - '!${base-path}/services/debugger/debugger_suite_test.go'
            - '!${base-path}/services/debugger/destination/destination_suite_test.go'
            - '!${base-path}/services/debugger/destination/eventDeliveryStatusUploader_test.go'
            - '!${base-path}/services/debugger/source/eventUploader_test.go'
            - '!${base-path}/services/debugger/source/source_suite_test.go'
            - '!${base-path}/services/debugger/transformation/transformation_suite_test.go'
            - '!${base-path}/services/debugger/transformation/transformationStatusUploader_test.go'
            - '!${base-path}/services/debugger/uploader_test.go'
            - '!${base-path}/services/fileuploader/fileuploader_test.go'
            - '!${base-path}/services/oauth/v2/cache_test.go'
            - '!${base-path}/services/oauth/v2/controlplane/controlplane_suite_test.go'
            - '!${base-path}/services/oauth/v2/controlplane/cp_connector_test.go'
            - '!${base-path}/services/oauth/v2/http/client_test.go'
            - '!${base-path}/services/oauth/v2/http/http_suite_test.go'
            - '!${base-path}/services/oauth/v2/http/transport_test.go'
            - '!${base-path}/services/oauth/v2/oauth_handler_test.go'
            - '!${base-path}/services/oauth/v2/utils_test.go'
            - '!${base-path}/services/oauth/v2/v2_suite_test.go'
            - '!${base-path}/services/rsources/handler_test.go'
            - '!${base-path}/services/rsources/rsources_suite_test.go'
            - '!${base-path}/services/rsources/stats_collector_test.go'
            - '!${base-path}/services/streammanager/kinesis/kinesis_suite_test.go'
            - '!${base-path}/services/streammanager/streammanager_suite_test.go'
            - '!${base-path}/services/transformer/features_impl_test.go'
            - '!${base-path}/services/transformer/features_suite_test.go'
            - '!${base-path}/services/transientsource/transientsource_test.go'
            - '!${base-path}/testhelper/log/log.go'
            - '!${base-path}/utils/misc/misc_suite_test.go'
            - '!${base-path}/utils/misc/misc_test.go'
            - '!${base-path}/utils/tests/async-helper.go'
            - '!${base-path}/utils/tests/matchers.go'
            - '!${base-path}/warehouse/utils/utils_suite_test.go'
            - '!${base-path}/warehouse/utils/utils_test.go'
          deny:
            - pkg: github.com/onsi/ginkgo
              desc: use the standard testing package with testify
            - pkg: github.com/onsi/gomega
              desc: use testify
    forbidigo:
      forbid:
        - pattern: ^json\.Marshal.*$
          pkg: ^encoding/json$
          msg: use jsonrs.Marshal instead
        - pattern: ^json\.Unmarshal$
          pkg: ^encoding/json$
          msg: use jsonrs.UnMarshal instead
        - pattern: ^json\.NewDecoder.*$
          pkg: ^encoding/json$
          msg: use jsonrs.NewDecoder instead
        - pattern: ^json\.NewEncoder.*$
          pkg: ^encoding/json$
          msg: use jsonrs.NewEncoder instead
        # Rules for enforcing the go-kit non-sugared logger
        - pattern: Logger.Debug(f|w)?$
          pkg: ^github.com/rudderlabs/rudder-go-kit/logger$
          msg: use Logger.Debugn instead
        - pattern: Logger\.Info(f|w)?$
          pkg: ^github.com/rudderlabs/rudder-go-kit/logger$
          msg: use Logger.Infon instead
        - pattern: Logger.Warn(f|w)?$
          pkg: ^github.com/rudderlabs/rudder-go-kit/logger$
          msg: use Logger.Warnn instead
        - pattern: Logger.Error(f|w)?$
          pkg: ^github.com/rudderlabs/rudder-go-kit/logger$
          msg: use Logger.Errorn instead
        - pattern: Logger.Fatal(f|w)?$
          pkg: ^github.com/rudderlabs/rudder-go-kit/logger$
          msg: use Logger.Fataln instead
        - pattern: Logger.With$
          pkg: ^github.com/rudderlabs/rudder-go-kit/logger$
          msg: use Logger.Withn instead
        - pattern: NewField$
          pkg: ^github.com/rudderlabs/rudder-go-kit/logger$
          msg: use type specific counterpart e.g. NewStringField, NewIntField, etc...
        - pattern: NewErrorField$
          pkg: ^github.com/rudderlabs/rudder-go-kit/logger$
          msg: use rudder-observability-kit Error function
        # Rules for enforcing cenkalti/backoff/v5
        - pattern: ^backoff\..*$
          pkg: ^github.com/cenkalti/backoff$
          msg: use github.com/cenkalti/backoff/v5
        - pattern: ^backoff\..*$
          pkg: ^github.com/cenkalti/backoff/v[1-4]$
          msg: use github.com/cenkalti/backoff/v5
      analyze-types: true
    gosec:
      excludes:
        - G101  # Hardcoded credentials (6 findings)
        - G104  # Errors unhandled (6 findings)
        - G107  # HTTP request with variable URL (4 findings)
        - G110  # Decompression bomb (2 findings)
        - G115  # Integer overflow conversion (35 findings)
        - G201  # SQL string formatting (13 findings)
        - G202  # SQL string concatenation (3 findings)
        - G204  # Subprocess with variable (3 findings)
        - G301  # Directory permissions >0750 (21 findings)
        - G302  # File permissions >0600 (10 findings)
        - G304  # File inclusion via variable (68 findings)
        - G305  # Zip traversal (1 finding)
        - G306  # WriteFile permissions >0600 (1 finding)
        - G401  # Weak crypto primitive (2 findings)
        - G402  # TLS InsecureSkipVerify (2 findings)
        - G404  # Weak PRNG math/rand (8 findings)
        - G501  # Blocklisted import crypto/md5 (2 findings)
        - G602  # Slice index out of range (2 findings)
        - G702  # Command injection via taint analysis (1 finding, superseded G204)
        - G704  # SSRF via taint analysis (2 findings, supersedes G107)
        - G705  # XSS via taint analysis (1 finding)
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - bodyclose
        path: gateway/webhook/webhook_test.go
      - linters:
          - bodyclose
        path: processor/transformer/transformer.go
      - linters:
          - bodyclose
        path: gateway/gateway_test.go
      - linters:
          - bodyclose
        path: cmd/rudder-cli/status/status.go
      # clickhouse-go's Options.Debug is deprecated in favour of Logger; migrating
      # the query debug logs to a structured logger is tracked separately.
      - linters:
          - staticcheck
        path: warehouse/integrations/clickhouse/driver.go
        text: 'SA1019: .*Options\)\.Debug is deprecated'
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 50
  max-same-issues: 10
  new: false
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
