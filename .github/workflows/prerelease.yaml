on:
  push:
    branches:
      - "prerelease/*"
name: prerelease

permissions:
  contents: write # Required for creating releases
  pull-requests: write # Required for release-please to create/update PRs
jobs:
  prerelease:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install release-please
        run: npm ci --ignore-scripts --prefix .github/tools/release-please

      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PRIVATE_KEY }}
          permission-contents: write # to create release commits and tags
          permission-pull-requests: write # to create release PRs

      # release-please-action takes a custom title and changelog only from a config file, and ignores release-as with one.
      - name: Run release-please
        env:
          RELEASE_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          RELEASE_PLEASE=.github/tools/release-please/node_modules/.bin/release-please
          ARGS=(
            --token="$RELEASE_TOKEN"
            --repo-url="$GITHUB_REPOSITORY"
            --target-branch="$GITHUB_REF_NAME"
            --release-type=go
            --package-name=rudder-server
          )

          # Tags the version if its PR has been merged
          "$RELEASE_PLEASE" github-release "${ARGS[@]}" --prerelease

          # Opens or updates the PR. github-release only recognises merged PRs with a "chore: release" title.
          "$RELEASE_PLEASE" release-pr "${ARGS[@]}" \
            --release-as="${GITHUB_REF_NAME#prerelease/}" \
            --pull-request-title-pattern='chore: release ${version}' \
            --changelog-sections=feat,fix,chore,refactor,test,doc \
            --bump-minor-pre-major
